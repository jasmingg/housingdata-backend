spring.application.name=housingaffordability

# Override these in your deployment environment or local env file.
# Public-safe defaults are provided so the repo can be shared without exposing credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/housingaffordability}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

# Optional but recommended:
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Removing ASCII art from spring boot
spring.main.banner-mode=off

# Enable the use/trust of forwarded headers (like X-Forwarded-For) for Spring
# used to get the real client IP address when behind a reverse proxy
server.forward-headers-strategy=framework

# Running backend locally on this port because 8080 is taken by another app.
server.port=8081